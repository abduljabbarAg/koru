name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds the on-device inference engine for Android arm64. Separate from the
  # APK job because it needs the NDK and a Rust toolchain, and because a failure
  # here should say "glen would not build" rather than "the app would not build".
  glen:
    # Not required. If the cross-compile ever breaks, the app still ships: it
    # falls back to the built-in engine and Settings says the build has no
    # bundled model.
    #
    # Note: continue-on-error makes needs.glen.result report "success" even when
    # the job failed, so the model step gates on this job's output instead, which
    # is only set when a binary was actually produced.
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      binary: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build glen for android
        id: build
        run: |
          set -eu
          chmod +x tool/build_glen_android.sh
          # Builds from the copy vendored in third_party/glen, so no token and no
          # public window on another repository is needed. The script locates the
          # NDK itself from the clang the setup action put on PATH.
          ./tool/build_glen_android.sh
          {
            echo "path=android/app/src/main/jniLibs/arm64-v8a/libglen.so"
            echo "size=$(wc -c < android/app/src/main/jniLibs/arm64-v8a/libglen.so)"
          } >> "$GITHUB_OUTPUT"
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # Prove the binary is what we think it is.
      #
      # There is no interpreter check here, because glen links statically and a
      # static binary has no PT_INTERP at all. The earlier version grepped for one
      # and failed every time. What actually matters is the architecture, and that
      # nothing pulled glibc in, which is what an Android device would reject.
      - name: confirm the binary is arm64 and not glibc linked
        run: |
          set -eu
          FILE=android/app/src/main/jniLibs/arm64-v8a/libglen.so

          readelf -h "$FILE" | grep -q 'AArch64' || {
            echo "not an aarch64 binary"; exit 1; }
          echo "architecture: $(readelf -h "$FILE" | grep Machine | cut -d: -f2 | xargs)"

          if readelf -d "$FILE" 2>/dev/null | grep -q NEEDED; then
            echo "dynamic dependencies:"
            readelf -d "$FILE" | grep NEEDED | sed 's/^/  /'
          else
            echo "statically linked, no NEEDED entries"
          fi

          # A glibc-linked binary will not start on Android. This is the failure
          # that would otherwise show up as a crash on first launch.
          if strings "$FILE" | grep -q 'GLIBC_2'; then
            echo "binary references glibc and will not run on Android"
            strings "$FILE" | grep -o 'GLIBC_2\.[0-9]*' | sort -u | head
            exit 1
          fi
          echo "no glibc references"

      # Best effort. Artifact storage is an account-level condition with a
      # 0.5 GB monthly allowance, and when it is full this upload is the only
      # thing that fails. The release below carries the same file for tagged
      # builds, where release assets are not billed against Actions storage.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: libglen-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libglen.so
          retention-days: 7

      # Published first, so the APK job has an engine even when artifacts are
      # unavailable. The APK job needs this job, so the release exists by the
      # time it looks. Running the APK job first would race this.
      - name: publish the engine to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/src/main/jniLibs/arm64-v8a/libglen.so
          fail_on_unmatched_files: false
          body: |
            The on-device inference engine. The APK job picks this up if the
            Actions artifact store is unavailable.

  apk:
    runs-on: ubuntu-latest
    needs: [glen]
    steps:
      - uses: actions/checkout@v4

      - name: fetch the bundled engine from the artifact store
        # Missing when the glen job could not produce or upload a binary. The
        # APK still builds; the app then reports it has no bundled model.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: libglen-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      # Second route to the same 450 KB file, and the one that works when the
      # artifact quota is full. Costs one API call and is why a tagged build
      # still gets a working engine.
      - name: fetch the engine from the release if the artifact is missing
        if: ${{ startsWith(github.ref, 'refs/tags/v') && hashFiles('android/app/src/main/jniLibs/arm64-v8a/libglen.so') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          dest="android/app/src/main/jniLibs/arm64-v8a/libglen.so"

          # Asked for by asset id through the API rather than by the
          # browser_download_url. The CDN path answers 404 for a short while
          # after an upload even though the API already reports the asset as
          # uploaded, and curl's --retry does not retry a 404, so the download
          # failed on an asset that was plainly there.
          #
          # jq rather than an embedded python script: every line of a YAML block
          # scalar has to be indented, and a script at column zero silently ends
          # the step and takes the whole workflow with it.
          asset_id=""
          for attempt in 1 2 3 4 5 6; do
            asset_id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | jq -r '.assets[]? | select(.name == "libglen.so") | .id')
            if [ -n "$asset_id" ] && [ "$asset_id" != "null" ]; then
              break
            fi
            asset_id=""
            echo "release asset not listed yet, attempt $attempt"
            sleep 10
          done

          if [ -n "$asset_id" ]; then
            echo "fetching libglen.so as asset $asset_id"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" \
              -o "$dest"
            ls -la "$(dirname "$dest")"
          else
            echo "no engine available from either route; building without one"
          fi

      # Checked on disk rather than trusted from the job output.
      #
      # The glen job sets its output when the binary is *built*, which happens
      # before it is uploaded or fetched. When both routes fail, the output still
      # says yes, the model gets downloaded, and the result is a 464 MB APK
      # carrying a 491 MB model and no way to run it. A small app that admits it
      # has no model is far more useful than a large one that silently cannot
      # answer anything.
      - name: decide whether the engine actually arrived
        id: engine
        run: |
          set -eu
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libglen.so ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No inference engine, so the model is not bundled. The app will say so."
          fi

      # Bundled only when there is an engine to run it.
      #
      # The model is 491 MB and is copied into every per-ABI APK, so shipping it
      # without the binary means a 1.4 GB artifact that still cannot use it.
      # A 17 MB app that says "this build has no bundled model" is far more
      # useful than a gigabyte that does nothing.
      - name: fetch the model
        if: steps.engine.outputs.available == 'true'
        env:
          MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          set -eu
          mkdir -p assets/models
          curl -sL --retry 5 -C - -o assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf "$MODEL_URL"
          test "$(sha256sum assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -d' ' -f1)" \
            = "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db"
          ls -la assets/models/

      - name: say whether the model is going in
        run: |
          if [ -f assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf ]; then
            echo "Bundling the model: $(du -h assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -f1)"
          else
            echo "No engine binary, so no bundled model. The app still works."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          # Only the pub dependencies are cached, not the 763 MB Flutter SDK.
          #
          # `cache: true` caches both, and caches count against Actions storage.
          # The SDK alone was one and a half times the whole 0.5 GB monthly
          # quota, which stopped every artifact upload in the repository until
          # the caches were deleted. The pub cache is 22 MB and saves the part
          # worth saving; re-downloading the SDK costs a couple of minutes on a
          # build that already takes half an hour.
          cache: false
          pub-cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: build release apk
        run: flutter build apk --release --split-per-abi

      - name: build app bundle
        run: flutter build appbundle --release

      - name: collect artifacts
        run: |
          set -eu
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              cp "app-${abi}-release.apk" "koru-${abi}.apk"
              echo "koru-${abi}.apk"
            fi
          done
          ls -la

      # Only the arm64 build is published.
      #
      # The all-ABI artifact used to be uploaded too and was 1.39 GB, against
      # 464 MB for arm64, because the model is copied into each per-ABI APK and
      # the model is 491 MB. Nobody installs the other two architectures, and
      # keeping it cost about three quarters of the storage every run, which is
      # what exhausted the Actions quota: eleven runs on one day stopped the
      # build producing any APK at all.
      #
      # Retention is 3 days rather than 30 for the same reason. These are
      # regenerable from any commit, and the one you want is always the newest.
      #
      # Non-blocking on purpose. A storage quota is an account-level condition
      # that has nothing to do with whether this build was any good, and a red
      # cross here reads as "the code is broken" when analyze and test passed.
      # The APK is also attached to a release on a tag, and release assets do not
      # count against Actions storage at all.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: koru-apk-arm64
          path: build/app/outputs/flutter-apk/koru-arm64-v8a.apk
          retention-days: 3

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Release assets, not artifacts, because release storage is not billed
          # against the Actions quota. This is the dependable way to get the APK
          # off a tag when artifact storage is full or unavailable.
          files: |
            build/app/outputs/flutter-apk/koru-arm64-v8a.apk
            android/app/src/main/jniLibs/arm64-v8a/libglen.so
          generate_release_notes: true
          body: |
            ## Koru ${{ github.ref_name }}

            This build bundles the glen inference engine and a 0.5B model, so the
            on-device model engine needs no separate setup.

            Install the arm64 APK. The debug signing key is still in use, so an
            upgrade over an earlier build of Koru will not work until a release
            keystore is configured.