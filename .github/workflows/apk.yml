name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # Unused imports, variables and elements are errors in
      # analysis_options.yaml, so this step also guards against dead code
      # creeping back in. A third of the original codebase was unreachable.
      - name: analyze
        run: flutter analyze

      # A per-test timeout keeps a hung test from burning the whole job. The
      # mascot animates continuously, so any screen showing it can never be
      # settled with pumpAndSettle.
      - name: test
        run: flutter test --timeout=90s

      - name: build release apk
        run: flutter build apk --release --split-per-abi

      - name: build app bundle
        run: flutter build appbundle --release

      - name: collect artifacts
        run: |
          set -eu
          cd build/app/outputs/flutter-apk
          # --split-per-abi names them app-<abi>-release.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              cp "app-${abi}-release.apk" "koru-${abi}.apk"
              echo "koru-${abi}.apk"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: koru-apk
          path: build/app/outputs/flutter-apk/koru-*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: koru-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      # Only on a tag, and only after everything above passed.
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/koru-*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
          body: |
            ## Koru ${{ github.ref_name }}

            Download the APK for your device, or the AAB if you are installing
            through a store.

            These are built with the debug signing key unless a release keystore
            is configured in the repository secrets. Installing a later build
            over this one will fail until that is set up properly.
