name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Whether the on-device engine and its model go into the APK.
  #
  # Off for now. Bundling costs 486 MB on top of a roughly 16 MB app, which makes
  # every install slow and every update a near-gigabyte download, and a 0.5B model
  # on this phone turned out not to be worth carrying. The app does not need it:
  # cloud is the default engine, and a local model can still be added by dropping
  # a .gguf into the app's models folder. Flip this to "true" to ship the pair
  # again, which is one line rather than a code change.
  BUNDLE_LOCAL_ENGINE: "true"

jobs:
  # Builds the on-device inference engine for Android arm64. Separate from the
  # APK job because it needs the NDK and a Rust toolchain, and because a failure
  # here should say "the engine would not build" rather than "the app would not build".
  engine:
    # Not required. If the cross-compile ever breaks, the app still ships: it
    # falls back to the built-in engine and Settings says the build has no
    # bundled model.
    #
    # Note: continue-on-error makes needs.engine.result report "success" even when
    # the job failed, so the model step gates on this job's output instead, which
    # is only set when a binary was actually produced.
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      binary: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # Pinned, not a moving branch: the APK ships this binary, so the same
      # version of the app has to mean the same inference code regardless of
      # when it built. b11574 is the revision measured on the target phone at
      # 4.65 t/s on the bundled model.
      - name: fetch llama.cpp
        run: git clone --depth 1 -b b11574 https://github.com/ggml-org/llama.cpp third_party/llama.cpp

      - name: build the engine for android
        id: build
        run: |
          set -eu
          chmod +x tool/build_engine_android.sh
          NDK_ROOT="$ANDROID_NDK_HOME" ./tool/build_engine_android.sh
          {
            echo "path=android/app/src/main/jniLibs/arm64-v8a/libllama-server.so"
            echo "size=$(wc -c < android/app/src/main/jniLibs/arm64-v8a/libllama-server.so)"
          } >> "$GITHUB_OUTPUT"
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # Prove the binary is what we think it is.
      #
      # There is no interpreter check here, because the engine links against its own
      # static binary has no PT_INTERP at all. The earlier version grepped for one
      # and failed every time. What actually matters is the architecture, and that
      # nothing pulled glibc in, which is what an Android device would reject.
      - name: confirm the binary is arm64 and not glibc linked
        run: |
          set -eu
          FILE=android/app/src/main/jniLibs/arm64-v8a/libllama-server.so

          readelf -h "$FILE" | grep -q 'AArch64' || {
            echo "not an aarch64 binary"; exit 1; }
          echo "architecture: $(readelf -h "$FILE" | grep Machine | cut -d: -f2 | xargs)"

          if readelf -d "$FILE" 2>/dev/null | grep -q NEEDED; then
            echo "dynamic dependencies:"
            readelf -d "$FILE" | grep NEEDED | sed 's/^/  /'
          else
            echo "statically linked, no NEEDED entries"
          fi

          # A glibc-linked binary will not start on Android. This is the failure
          # that would otherwise show up as a crash on first launch.
          if strings "$FILE" | grep -q 'GLIBC_2'; then
            echo "binary references glibc and will not run on Android"
            strings "$FILE" | grep -o 'GLIBC_2\.[0-9]*' | sort -u | head
            exit 1
          fi
          echo "no glibc references"

      # Best effort. Artifact storage is an account-level condition with a
      # 0.5 GB monthly allowance, and when it is full this upload is the only
      # thing that fails. The release below carries the same file for tagged
      # builds, where release assets are not billed against Actions storage.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: llama-server-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          retention-days: 7

      # Published first, so the APK job has an engine even when artifacts are
      # unavailable. The APK job needs this job, so the release exists by the
      # time it looks. Running the APK job first would race this.
      - name: publish the engine to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          fail_on_unmatched_files: false
          body: |
            The on-device inference engine. The APK job picks this up if the
            Actions artifact store is unavailable.

  apk:
    runs-on: ubuntu-latest
    needs: [engine]
    steps:
      - uses: actions/checkout@v4

      - name: fetch the bundled engine from the artifact store
        # Missing when the engine job could not produce or upload a binary, and
        # skipped entirely when the local engine is not being bundled. The APK
        # builds either way; the app then reports it has no bundled model.
        if: env.BUNDLE_LOCAL_ENGINE == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llama-server-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      # Second route to the same 450 KB file, and the one that works when the
      # artifact quota is full. Costs one API call and is why a tagged build
      # still gets a working engine.
      - name: fetch the engine from the release if the artifact is missing
        if: ${{ env.BUNDLE_LOCAL_ENGINE == 'true' && startsWith(github.ref, 'refs/tags/v') && hashFiles('android/app/src/main/jniLibs/arm64-v8a/libllama-server.so') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dest="android/app/src/main/jniLibs/arm64-v8a/libllama-server.so"
          # jniLibs is not in the checkout, because the binary is a build
          # product. Without this the write below fails with curl error 23.
          mkdir -p "$(dirname "$dest")"

          # Asked for by asset id through the API rather than by the
          # browser_download_url. The CDN path answers 404 for a short while
          # after an upload even though the API already reports the asset as
          # uploaded, and curl's --retry does not retry a 404, so the download
          # failed on an asset that was plainly there.
          #
          # jq rather than an embedded python script: every line of a YAML block
          # scalar has to be indented, and a script at column zero silently ends
          # the step and takes the whole workflow with it.
          asset_id=""
          for attempt in 1 2 3 4 5 6; do
            asset_id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | jq -r '.assets[]? | select(.name == "libllama-server.so") | .id' || true)
            case "$asset_id" in
              ''|null) asset_id="" ;;
            esac
            if [ -n "$asset_id" ]; then
              break
            fi
            echo "release asset not listed yet, attempt $attempt"
            sleep 10
          done

          # Never fatal. A build with no engine still works and says so, and the
          # step below decides that from the file on disk. Failing here instead
          # would take out the whole APK for a missing optional binary.
          if [ -n "$asset_id" ]; then
            echo "fetching libllama-server.so as asset $asset_id"
            if curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id" \
                 -o "$dest" && [ -s "$dest" ]; then
              echo "got $(wc -c < "$dest") bytes"
              ls -la "$(dirname "$dest")"
            else
              rm -f "$dest"
              echo "download failed; continuing without an engine"
            fi
          else
            echo "no release asset; continuing without an engine"
          fi
          exit 0

      # Checked on disk rather than trusted from the job output.
      #
      # The engine job sets its output when the binary is *built*, which happens
      # before it is uploaded or fetched. When both routes fail, the output still
      # says yes, the model gets downloaded, and the result is a 464 MB APK
      # carrying a 491 MB model and no way to run it. A small app that admits it
      # has no model is far more useful than a large one that silently cannot
      # answer anything.
      - name: decide whether the engine actually arrived
        id: engine
        run: |
          set -eu
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libllama-server.so ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No inference engine, so the model is not bundled. The app will say so."
          fi

      # Bundled only when there is an engine to run it.
      #
      # The model is 231 MB and is copied into every per-ABI APK, so shipping it
      # without the binary means a 1.4 GB artifact that still cannot use it.
      # A 17 MB app that says "this build has no bundled model" is far more
      # useful than a gigabyte that does nothing.
      - name: fetch the model
        if: steps.engine.outputs.available == 'true' && env.BUNDLE_LOCAL_ENGINE == 'true'
        env:
          MODEL_URL: https://huggingface.co/prism-ml/Bonsai-1.7B-gguf/resolve/main/Bonsai-1.7B-Q1_0.gguf
        run: |
          set -eu
          mkdir -p assets/models
          curl -sL --retry 5 -C - -o assets/models/Bonsai-1.7B-Q1_0.gguf "$MODEL_URL"
          test "$(sha256sum assets/models/Bonsai-1.7B-Q1_0.gguf | cut -d' ' -f1)" \
            = "3d7c6c90dd98717a203adb22d5eacd2581850e40aa5327e144b97766cae5f7e3"
          ls -la assets/models/

      - name: say whether the model is going in
        run: |
          if [ -f assets/models/Bonsai-1.7B-Q1_0.gguf ]; then
            echo "Bundling the model: $(du -h assets/models/Bonsai-1.7B-Q1_0.gguf | cut -f1)"
          else
            echo "No engine binary, so no bundled model. The app still works."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # The version is not cosmetic. flutter_timezone 5.x needs meta
          # ^1.16, and meta is pinned by the Dart SDK: Dart 3.6 (Flutter 3.27)
          # pins 1.15.0, so 3.27 still could not resolve and pub get failed
          # before anything compiled. Dart 3.7 (Flutter 3.29) pins 1.16.0.
          # CardThemeData also needs 3.27 or newer.
          #
          # CI was on 3.24, so the calendar and assistant work had never been
          # built here at all.
          flutter-version: "3.29.3"
          channel: stable
          # Only the pub dependencies are cached, not the 763 MB Flutter SDK.
          #
          # `cache: true` caches both, and caches count against Actions storage.
          # The SDK alone was one and a half times the whole 0.5 GB monthly
          # quota, which stopped every artifact upload in the repository until
          # the caches were deleted. The pub cache is 22 MB and saves the part
          # worth saving; re-downloading the SDK costs a couple of minutes on a
          # build that already takes half an hour.
          cache: false
          pub-cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      # The Gradle build refuses to sign a release with the debug key unless
      # this is set explicitly, because a debug-signed "release" succeeds and
      # looks fine while being uninstallable in place for every user. CI has no
      # keystore, so it opts in here on purpose rather than by default.
      - name: build release apk
        run: flutter build apk --release --split-per-abi -Pkoru.allowDebugSigning=true

      - name: build app bundle
        run: flutter build appbundle --release -Pkoru.allowDebugSigning=true

      - name: collect artifacts
        run: |
          set -eu
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              cp "app-${abi}-release.apk" "koru-${abi}.apk"
              echo "koru-${abi}.apk"
            fi
          done
          ls -la

      # Only the arm64 build is published.
      #
      # The all-ABI artifact used to be uploaded too and was 1.39 GB, against
      # 464 MB for arm64, because the model is copied into each per-ABI APK and
      # the model is 491 MB. Nobody installs the other two architectures, and
      # keeping it cost about three quarters of the storage every run, which is
      # what exhausted the Actions quota: eleven runs on one day stopped the
      # build producing any APK at all.
      #
      # Retention is 3 days rather than 30 for the same reason. These are
      # regenerable from any commit, and the one you want is always the newest.
      #
      # Non-blocking on purpose. A storage quota is an account-level condition
      # that has nothing to do with whether this build was any good, and a red
      # cross here reads as "the code is broken" when analyze and test passed.
      # The APK is also attached to a release on a tag, and release assets do not
      # count against Actions storage at all.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: koru-apk-arm64
          path: build/app/outputs/flutter-apk/koru-arm64-v8a.apk
          retention-days: 3

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Release assets, not artifacts, because release storage is not billed
          # against the Actions quota. This is the dependable way to get the APK
          # off a tag when artifact storage is full or unavailable.
          files: |
            build/app/outputs/flutter-apk/koru-arm64-v8a.apk
            android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          generate_release_notes: true
          body: |
            ## Koru ${{ github.ref_name }}

            This build bundles the llama.cpp inference engine and a 0.5B model, so the
            on-device model engine needs no separate setup.

            Install the arm64 APK. The debug signing key is still in use, so an
            upgrade over an earlier build of Koru will not work until a release
            keystore is configured.