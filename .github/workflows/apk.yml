name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Whether the on-device engine and its model go into the APK. There is no
  # on-device engine: it cost 486 MB on top of a 16 MB app and it was the direct
  # cause of every complaint about the assistant. The engine job that read this
  # flag went with it, so nothing reads it now — it is kept because it was the
  # decision, and changing someone's mind about a 486 MB download is one line
  # rather than a code change.
  BUNDLE_LOCAL_ENGINE: "false"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # The version is not cosmetic. flutter_timezone 5.x needs meta
          # ^1.16, and meta is pinned by the Dart SDK: Dart 3.6 (Flutter 3.27)
          # pins 1.15.0, so 3.27 still could not resolve and pub get failed
          # before anything compiled. Dart 3.7 (Flutter 3.29) pins 1.16.0.
          # CardThemeData also needs 3.27 or newer.
          #
          # CI was on 3.24, so the calendar and assistant work had never been
          # built here at all.
          flutter-version: "3.29.3"
          channel: stable
          # Only the pub dependencies are cached, not the 763 MB Flutter SDK.
          #
          # `cache: true` caches both, and caches count against Actions storage.
          # The SDK alone was one and a half times the whole 0.5 GB monthly
          # quota, which stopped every artifact upload in the repository until
          # the caches were deleted. The pub cache is 22 MB and saves the part
          # worth saving; re-downloading the SDK costs a couple of minutes on a
          # build that already takes half an hour.
          cache: false
          pub-cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      # The Gradle build refuses to sign a release with the debug key unless
      # this is set explicitly, because a debug-signed "release" succeeds and
      # looks fine while being uninstallable in place for every user. CI has no
      # keystore, so it opts in here on purpose rather than by default.
      - name: build release apk
        run: flutter build apk --release --split-per-abi -Pkoru.allowDebugSigning=true

      - name: build app bundle
        run: flutter build appbundle --release -Pkoru.allowDebugSigning=true

      - name: collect artifacts
        run: |
          set -eu
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              cp "app-${abi}-release.apk" "koru-${abi}.apk"
              echo "koru-${abi}.apk"
            fi
          done
          ls -la

      # Only the arm64 build is published.
      #
      # The all-ABI artifact used to be uploaded too, and it was 1.39 GB
      # against 464 MB for arm64, because the bundled model was copied into
      # every per-ABI APK. Nobody installs the other two architectures and
      # keeping them cost about three quarters of the storage every run, which is
      # what exhausted the Actions quota: eleven runs on one day stopped the
      # build producing any APK at all. A 16 MB app would fit in the quota
      # either way, so the rule is kept rather than re-learned.
      #
      # Retention is 3 days rather than 30 for the same reason. These are
      # regenerable from any commit, and the one you want is always the newest.
      #
      # Non-blocking on purpose. A storage quota is an account-level condition
      # that has nothing to do with whether this build was any good, and a red
      # cross here reads as "the code is broken" when analyze and test passed.
      # The APK is also attached to a release on a tag, and release assets do not
      # count against Actions storage at all.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: koru-apk-arm64
          path: build/app/outputs/flutter-apk/koru-arm64-v8a.apk
          retention-days: 3

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Release assets, not artifacts, because release storage is not billed
          # against the Actions quota. This is the dependable way to get the APK
          # off a tag when artifact storage is full or unavailable.
          files: build/app/outputs/flutter-apk/koru-arm64-v8a.apk
          generate_release_notes: true
          body: |
            ## Koru ${{ github.ref_name }}

            Three tabs — Today, Clients, Money — and a "Tell Koru" button in the
            middle of the bar. Adding clients, recording payments and the
            morning queue all work on the phone; questions go to one cloud
            model, and you paste its key in Settings. Nothing is bundled in the
            APK.

            Install the arm64 APK. The debug signing key is still in use, so an
            upgrade over an earlier build of Koru will not work until a release
            keystore is configured.