name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds the on-device inference engine for Android arm64. Separate from the
  # APK job because it needs the NDK and a Rust toolchain, and because a failure
  # here should say "glen would not build" rather than "the app would not build".
  glen:
    # Not required. If the cross-compile ever breaks, the app still ships: it
    # falls back to the built-in engine and Settings says the build has no
    # bundled model.
    #
    # Note: continue-on-error makes needs.glen.result report "success" even when
    # the job failed, so the model step gates on this job's output instead, which
    # is only set when a binary was actually produced.
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      binary: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build glen for android
        id: build
        run: |
          set -eu
          chmod +x tool/build_glen_android.sh
          # Builds from the copy vendored in third_party/glen, so no token and no
          # public window on another repository is needed. The script locates the
          # NDK itself from the clang the setup action put on PATH.
          ./tool/build_glen_android.sh
          {
            echo "path=android/app/src/main/jniLibs/arm64-v8a/libglen.so"
            echo "size=$(wc -c < android/app/src/main/jniLibs/arm64-v8a/libglen.so)"
          } >> "$GITHUB_OUTPUT"
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: confirm it is an arm64 bionic binary
        run: |
          set -eu
          FILE=android/app/src/main/jniLibs/arm64-v8a/libglen.so
          # Machine must be aarch64 and the interpreter must be bionic's linker,
          # not glibc's, or Android will refuse to run it.
          readelf -h "$FILE" | grep -E 'Machine'
          readelf -l "$FILE" | grep -i interpreter
          readelf -l "$FILE" | grep -q "ld-android" \
            || { echo "not linked against bionic"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: libglen-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libglen.so
          retention-days: 30

  apk:
    runs-on: ubuntu-latest
    needs: [glen]
    steps:
      - uses: actions/checkout@v4

      - name: fetch the bundled engine, if it was built
        # Missing when the glen job could not clone the private repo. The APK
        # still builds; the app then reports it has no bundled model.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: libglen-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      # Bundled only when there is an engine to run it.
      #
      # The model is 491 MB and is copied into every per-ABI APK, so shipping it
      # without the binary means a 1.4 GB artifact that still cannot use it.
      # A 17 MB app that says "this build has no bundled model" is far more
      # useful than a gigabyte that does nothing.
      - name: fetch the model
        if: needs.glen.outputs.binary != ''
        env:
          MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          set -eu
          mkdir -p assets/models
          curl -sL --retry 5 -C - -o assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf "$MODEL_URL"
          test "$(sha256sum assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -d' ' -f1)" \
            = "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db"
          ls -la assets/models/

      - name: say whether the model is going in
        run: |
          if [ -f assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf ]; then
            echo "Bundling the model: $(du -h assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -f1)"
          else
            echo "No engine binary, so no bundled model. The app still works."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: build release apk
        run: flutter build apk --release --split-per-abi

      - name: build app bundle
        run: flutter build appbundle --release

      - name: collect artifacts
        run: |
          set -eu
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              cp "app-${abi}-release.apk" "koru-${abi}.apk"
              echo "koru-${abi}.apk"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: koru-apk
          path: build/app/outputs/flutter-apk/koru-*.apk
          retention-days: 30

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/koru-*.apk
          generate_release_notes: true
          body: |
            ## Koru ${{ github.ref_name }}

            This build bundles the glen inference engine and a 0.5B model, so the
            on-device model engine needs no separate setup.

            Install the arm64 APK. The debug signing key is still in use, so an
            upgrade over an earlier build of Koru will not work until a release
            keystore is configured.