name: koru
description: Koru - a local-first AI companion that knows your life and your business.
publish_to: "none"
# versionCode has to strictly increase for an update to install over an existing
# build. It sat at 2 across every 1.x release, so no APK could ever upgrade
# another in place and every install needed a manual uninstall first. 1.3.0 is
# the next real release, so the code jumps past everything shipped so far.
version: 1.4.0+14

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  http: ^1.2.1
  # Only used to hand a written backup file to the share sheet, so the user can
  # keep a copy somewhere the app cannot reach.
  share_plus: ^7.2.2
  # Only used to let the user pick a backup file back in.
  file_picker: ^8.0.0
  device_calendar: ^4.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Real SQLite in tests, so the store is exercised rather than mocked.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/splash/
    # The bundled model. CI writes this file before building, so a fresh
    # checkout does not carry 491 MB in git.
    - assets/models/
