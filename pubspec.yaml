name: koru
description: Koru - a local-first AI companion that knows your life and your business.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  http: ^1.2.1
  # Only used to hand a written backup file to the share sheet, so the user can
  # keep a copy somewhere the app cannot reach.
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Real SQLite in tests, so the store is exercised rather than mocked.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/splash/
    # The bundled model. CI writes this file before building, so a fresh
    # checkout does not carry 491 MB in git.
    - assets/models/
