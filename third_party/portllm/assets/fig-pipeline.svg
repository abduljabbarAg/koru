<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250"
     width="900" height="250" role="img" aria-label="The path one generated token takes">
  <title>The path one generated token takes</title>
  <rect width="900" height="250" fill="#F6F8FC"/>
  <text x="40" y="50" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27"
        font-weight="700" fill="#0C1526">One token</text>
  <text x="40" y="76" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15"
        fill="#5A6B85">Every stage is verified against a reference implementation.</text>
  <rect x="48" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="96.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">Token</text>
  <text x="96.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">BPE</text>
  <path d="M147 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="158" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="206.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">Embed</text>
  <text x="206.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">f32</text>
  <path d="M257 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="268" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="316.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">RMSNorm</text>
  <text x="316.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">verified</text>
  <path d="M367 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="378" y="118" width="96" height="62" rx="12" fill="#2F6FEB" opacity="0.92"/>
  <text x="426.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">Q K V</text>
  <text x="426.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">NEON</text>
  <path d="M477 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="488" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="536.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">RoPE</text>
  <text x="536.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">split-half</text>
  <path d="M587 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="598" y="118" width="96" height="62" rx="12" fill="#2F6FEB" opacity="0.92"/>
  <text x="646.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">Attn</text>
  <text x="646.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">GQA + KV</text>
  <path d="M697 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="708" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="756.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">SwiGLU</text>
  <text x="756.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">verified</text>
  <path d="M807 149 l8 0" stroke="#5A6B85" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="818" y="118" width="96" height="62" rx="12" fill="#CBD5E1" opacity="1"/>
  <text x="866.0" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="16" font-weight="700" fill="#FFFFFF">Logits</text>
  <text x="866.0" y="166" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="12" fill="#E8F0FE">sampled</text>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 l7 3.5 l-7 3.5 z" fill="#5A6B85"/>
    </marker>
  </defs>
  <text x="48" y="215" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14"
        fill="#5A6B85">x 24 layers, every one of them</text>
</svg>
